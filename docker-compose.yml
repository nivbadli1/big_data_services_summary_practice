# QuickBite capstone - the whole Big Data Services module in ONE compose file.
#
#   docker compose up -d --build      # first start: 5-10 min (downloads ~4 GB of images once)
#   docker compose ps                 # wait until every service shows (healthy)
#   docker compose down               # stop (data in volumes is kept)
#   docker compose down -v            # stop AND delete all data (a full reset)
#
# Memory: needs ~5.5 GB free for Docker (limits below add up to ~7 GB; real use is ~5 GB). On Docker Desktop set Settings -> Resources ->
# Memory to at least 6 GB (8 GB is comfortable). See README "Requirements".
#
# Services (all names resolve INSIDE the Docker network only):
#   mongo           MongoDB 8.0, single-node replica set rs0        localhost:27017
#   course-kafka    Kafka 3.8 single broker, KRaft (no ZooKeeper)   course-kafka:9092 (inside) / localhost:29092
#   elasticsearch   Elasticsearch 8.15, single node, no security    http://localhost:9200
#   kibana          Kibana 8.15                                     http://localhost:5601
#   airflow         Airflow 2.8.4 "standalone" (SQLite + SequentialExecutor, no Celery/Redis)
#                                                                   http://localhost:8080  (airflow / airflow)
#   apps            python:3.11-slim - runs the simulators, YOUR consumer, the chaos script and tests
#   kafdrop         OPTIONAL web UI for Kafka (same tool as the Kafka lessons)  http://localhost:9003
#                   start it with:  docker compose --profile ui up -d kafdrop

name: quickbite

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 10s
  retries: 30

services:

  mongo:
    image: mongo:8.0
    container_name: mongo
    hostname: mongo
    # A replica set (even with ONE member) is what real systems run; it also enables the oplog
    # and change streams (Appendix A). Same setup as the MongoDB lesson.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # The healthcheck doubles as the initializer (from the MongoDB lesson):
    #   replica set already initiated -> rs.status() works -> healthy
    #   otherwise -> rs.initiate() with host "mongo:27017"
    healthcheck:
      <<: *hc
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }
      start_period: 15s
    mem_limit: 768m

  course-kafka:
    # The Kafka lessons used wurstmeister/kafka (which needs ZooKeeper). Here we use the official
    # image in KRaft mode: ONE container, less memory. Same name and port for your code:
    # course-kafka:9092, and the same Python library (kafka-python).
    image: apache/kafka:3.8.1
    container_name: course-kafka
    hostname: course-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller            # KRaft: this one node is broker AND controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://course-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@course-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1          # single broker -> replication factor 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk                 # fixed KRaft cluster id (22-char base64 UUID)
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    # No volume on purpose: Kafka data lives in the container. `docker compose stop/start`
    # keeps it; `docker compose down` deletes topics and consumer offsets (a clean restart).
    ports:
      - "29092:29092"                                    # only for tools on your laptop (optional)
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 30s
    mem_limit: 768m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"                    # practice only - never in production
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.routing.allocation.disk.threshold_enabled: "false"   # do not go read-only on a full laptop disk
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      start_period: 40s
    mem_limit: 1800m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: "--max-old-space-size=800"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      start_period: 90s
      retries: 40
    mem_limit: 1200m

  airflow:
    build: ./airflow                                     # apache/airflow:2.8.4 + pymongo (see airflow/Dockerfile)
    image: quickbite-airflow:2.8.4
    container_name: airflow
    # "airflow standalone" = webserver + scheduler + triggerer in ONE container, SQLite metadata DB,
    # SequentialExecutor (one task at a time). Perfect for a laptop, never for production.
    # We create the airflow/airflow user first so the login is the same as in the Airflow lesson.
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username airflow --password airflow --firstname Air --lastname Flow \
           --role Admin --email airflow@example.com || true) &&
        exec airflow standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      # SQLite file on a named volume -> Variables (your watermark!) and run history survive `down`
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__WORKERS: "2"                   # fewer gunicorn workers = less RAM
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"    # see new/changed DAG files within ~30 s
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      ES_URL: http://elasticsearch:9200
      QUICKBITE_OUTPUT: /opt/airflow/output
    ports:
      - "8080:8080"
    volumes:
      - airflow_db:/opt/airflow/db
      - ./airflow/dags:/opt/airflow/dags
      - ./output:/opt/airflow/output                     # Gold CSVs appear in ./output on your laptop
      - ./solution/airflow/dags:/opt/airflow/solution_dags:ro
    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8080/health"]
      start_period: 120s
      retries: 40
    mem_limit: 2g

  apps:
    build: ./apps                                        # python:3.11-slim + apps/requirements.txt
    image: quickbite-apps:1.0
    container_name: apps
    command: ["sleep", "infinity"]                       # you start things with: docker compose exec apps ...
    environment:
      PYTHONPATH: /apps
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP: course-kafka:9092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      ES_URL: http://elasticsearch:9200
      ORDERS_PER_MIN: "20"
      PROMISE_SECONDS: "120"
    volumes:
      - ./apps:/apps
      - ./seed:/seed
      - ./chaos:/chaos
      - ./tests:/tests
      - ./airflow:/airflow
      - ./solution:/solution
      - ./output:/output
    depends_on:
      mongo:
        condition: service_healthy
      course-kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    mem_limit: 512m

  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    profiles: ["ui"]                                     # not started by default (saves ~300 MB)
    environment:
      KAFKA_BROKERCONNECT: course-kafka:9092
      JVM_OPTS: "-Xms32M -Xmx128M"
    ports:
      - "9003:9000"
    depends_on:
      course-kafka:
        condition: service_healthy

volumes:
  mongo_data:
  es_data:
  airflow_db:
